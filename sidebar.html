<!-- INNER PAGE ONLY (DYNAMIC ADSENSE) -->
<div id="adInner" style="display:none"></div>

<script>
(function(){
  var path = window.location.pathname;

  // Homepage / Index page condition check
  var isTripPage =
    path === "" ||
    path === "/index.html" ||
    path.endsWith("/index.html") ;

  var hasQuery = location.search.length > 0;

  // 1. Home page par Trip.com show hoga
  if (isTripPage) {
    var homeBox = document.getElementById("adHome");
    if (homeBox) homeBox.style.display = "block";
    return;
  }

  // 2. Inner pages (bina URL query params ke) par AdSense load hoga
  if (!hasQuery) {
    var box = document.getElementById("adInner");
    if (box) {
      box.style.display = "block";

      // Dynamically load AdSense JS
      var s = document.createElement("script");
      s.async = true;
      s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4305348743992957";
      s.crossOrigin = "anonymous";
      document.head.appendChild(s);

      // AdSense Container
      var ins = document.createElement("ins");
      ins.className = "adsbygoogle";
      ins.style.display = "inline-block";
      ins.style.width = "300px";
      ins.style.height = "250px";
      ins.setAttribute("data-ad-client", "ca-pub-4305348743992957");
      ins.setAttribute("data-ad-slot", "3614194127");
      box.appendChild(ins);

      s.onload = function () {
        (window.adsbygoogle = window.adsbygoogle || []).push({});
      };
    }
  }
})();
</script>
